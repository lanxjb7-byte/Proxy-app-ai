<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>PROXY AI.com</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{
 --bg:#080808;--panel:#101010;--card:#171717;--hover:#202020;
 --text:#f3f3f3;--muted:#858585;--line:#292929;--red:#e72d36;
 --soft:#251012;
}
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}
body{font:15px/1.6 system-ui,-apple-system,Arial,sans-serif}
button,textarea{font:inherit;color:inherit}
button{
 cursor:pointer;
 outline:none!important;
 -webkit-tap-highlight-color:transparent;
}
button:focus,button:focus-visible,textarea:focus,input:focus{
 outline:none!important;
 box-shadow:none;
}
button:active{transform:scale(.98)}
.app{height:100dvh;display:flex;overflow:hidden;background:var(--bg)}
.sidebar{
 width:265px;flex-shrink:0;background:#0d0d0d;
 border-right:1px solid var(--line);display:flex;
 flex-direction:column;padding:17px 13px;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850;letter-spacing:1px;padding:3px 4px}
.brand em{font-style:normal;color:var(--red)}
.logo{
 display:grid;place-items:center;width:37px;height:37px;
 background:var(--red);color:white;border-radius:10px;font-weight:900
}
.btn{
 width:100%;border:1px solid var(--line);background:var(--panel);
 border-radius:11px;padding:11px 12px;text-align:left;
 transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--hover)}
.new{background:var(--red);border-color:var(--red);color:white;font-weight:750;text-align:center}
.new:hover{background:#c9212a}
.section{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:800;margin:3px 0}
.history{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px}
.history-item{display:flex;gap:5px;align-items:center}
.history-item .select-chat{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.history-item .active{background:#211011;border-color:#612027}
.del{border:0;background:transparent;color:var(--muted);padding:7px}
.side-bottom{display:grid;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
 height:61px;flex-shrink:0;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;padding:0 19px;gap:10px;
 background:#090909;
}
.top-left{display:flex;align-items:center;gap:12px}
.top-title{font-weight:800;font-size:15px}
.status{font-size:10px;color:var(--muted)}
.status i{display:inline-block;width:6px;height:6px;background:#40c982;border-radius:50%;margin-right:5px}
.iconbtn{background:#141414;border:1px solid #292929;border-radius:9px;padding:8px 11px}
.iconbtn:hover{background:#202020}
.mobile-new{display:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.messages{max-width:850px;margin:auto;padding:30px 22px 22px}
.welcome{text-align:center;padding:11vh 10px 35px}
.welcome-logo{
 width:64px;height:64px;display:grid;place-items:center;
 background:#180d0e;border:1px solid #4b2023;color:var(--red);
 border-radius:19px;margin:0 auto 20px;font-size:28px;font-weight:900
}
.welcome h1{font-size:clamp(27px,5vw,42px);line-height:1.2;margin:0 0 13px}
.welcome h1 span{color:var(--red)}
.welcome p{color:var(--muted);margin:0 auto 25px;max-width:440px;font-size:13px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.suggestion{
 border:1px solid var(--line);background:#111;border-radius:12px;
 padding:10px 13px;font-size:12px;
}
.suggestion:hover{border-color:#6c292e;background:#191011}
.message{display:flex;gap:12px;margin-bottom:27px;align-items:flex-start}
.avatar{
 width:31px;height:31px;flex-shrink:0;display:grid;place-items:center;
 border-radius:9px;background:#181818;border:1px solid #303030;
 font-size:12px;font-weight:850;
}
.message.assistant .avatar{background:var(--red);color:#fff;border-color:var(--red)}
.content{min-width:0;flex:1;overflow-wrap:anywhere}
.msg-head{font-size:11px;color:var(--muted);margin:3px 0 8px;font-weight:750}
.user-text{
 background:#151515;border:1px solid #252525;border-radius:13px;
 padding:11px 14px;display:inline-block;white-space:pre-wrap;max-width:100%;
}
.prose{line-height:1.75}
.prose p{margin:0 0 13px}
.prose h1,.prose h2,.prose h3{line-height:1.35;margin:22px 0 10px}
.prose ul,.prose ol{padding-left:23px}
.prose a{color:#ff686f}
.prose blockquote{margin:12px 0;border-left:3px solid var(--red);padding-left:13px;color:#aaa}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;width:100%;margin:12px 0}
.prose td,.prose th{border:1px solid #333;padding:8px;text-align:left}
.prose :not(pre)>code{background:#202020;border:1px solid #333;border-radius:5px;padding:2px 5px;font-size:.9em}
.prose pre{
 position:relative;background:#090909;border:1px solid #303030;
 border-radius:11px;padding:43px 13px 14px;overflow-x:auto;color:#eee;
 line-height:1.6;max-width:100%;
}
.prose pre code{font:13px/1.65 ui-monospace,Consolas,monospace;white-space:pre}
.code-label{
 position:absolute;top:0;left:0;right:0;padding:7px 12px;
 background:#141414;border-bottom:1px solid #303030;color:#aaa;font-size:11px
}
.code-copy{
 position:absolute;top:5px;right:6px;padding:4px 8px;
 border:1px solid #383838;background:#202020;color:#eee;
 border-radius:6px;font-size:10px
}
.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.smallbtn{background:transparent;border:1px solid #303030;border-radius:8px;padding:5px 9px;color:#aaa;font-size:11px}
.smallbtn:hover{background:#191919;color:white}
.typing{display:flex;gap:5px;padding:8px 0}
.typing span{width:7px;height:7px;background:var(--red);border-radius:50%;animation:bounce .9s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.25;transform:translateY(-5px)}}
.composer-area{padding:12px 17px 16px;background:#080808}
.composer{
 max-width:820px;margin:auto;border:1px solid #303030;
 background:#111;border-radius:17px;padding:10px;
}
.composer:focus-within{border-color:#4b292b}
#prompt{
 display:block;width:100%;resize:none;max-height:180px;min-height:45px;
 padding:10px 9px;background:transparent;border:0;outline:none!important;
 box-shadow:none!important;color:var(--text);font-size:15px;
 -webkit-appearance:none;appearance:none;border-radius:0;
}
#prompt::placeholder{color:#777}
.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 3px 1px}
.hint{font-size:10px;color:#777}
.send{
 background:var(--red);color:#fff;border:0;border-radius:10px;
 width:42px;height:39px;font-size:21px;font-weight:850;
}
.send:disabled{opacity:.45}
.disclaimer{text-align:center;font-size:10px;color:#666;margin-top:8px}
.error{color:#ff737b;font-size:12px;margin:10px 0 15px}
@media(max-width:700px){
 .sidebar{
  position:fixed;z-index:10;top:0;bottom:0;left:0;
  transform:translateX(-105%);transition:transform .2s;
  box-shadow:12px 0 35px #0008;
 }
 .sidebar.open{transform:translateX(0)}
 .mobile-new{display:block}
 .top{height:57px;padding:0 12px}
 .messages{padding:22px 13px}
 .welcome{padding-top:10vh}
 .composer-area{padding:8px 9px calc(9px + env(safe-area-inset-bottom))}
 .hint{max-width:210px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">P</div>PROXY <em>AI</em></div>
 <button class="btn new" id="newChat">＋ &nbsp; Chat Baru</button>
 <div class="section">RIWAYAT CHAT</div>
 <div class="history" id="history"></div>
 <div class="side-bottom">
  <button class="btn" id="themeBtn">◐ &nbsp; Tema hitam</button>
  <div class="status">● PROXY AI ASSISTEN</div>
 </div>
</aside>

<main class="main">
 <header class="top">
  <div class="top-left">
   <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
   <div><div class="top-title">PROXY AI</div><div class="status"><i></i>AI ASSISTEN</div></div>
  </div>
  <button class="iconbtn mobile-new" id="mobileNew">＋ CREATE</button>
 </header>
 <div class="scroll" id="scroll"><div class="messages" id="messages"></div></div>
 <div class="composer-area">
  <form class="composer" id="chatForm">
   <textarea id="prompt" placeholder="Tanya apa saja ke PROXY...." rows="1" maxlength="8000" required></textarea>
   <div class="compose-bottom">
    <span class="hint">Enter untuk kirim · Shift + Enter untuk baris baru</span>
    <button class="send" id="sendBtn" aria-label="Kirim pesan">↑</button>
   </div>
  </form>
  <div class="disclaimer">PROXY dapat membuat kesalahan. Periksa informasi penting.</div>
 </div>
</main>
</div>

<script>
marked.setOptions({gfm:true,breaks:true});
const $=id=>document.getElementById(id);
const STORE="lanx_ai_chats_v2";
let chats=[],currentId=null,busy=false,pendingError="";
try{
 chats=JSON.parse(localStorage.getItem(STORE)||"[]");
 if(!Array.isArray(chats))chats=[];
}catch{chats=[]}

function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function current(){return chats.find(c=>c.id===currentId)}
function save(){
 try{localStorage.setItem(STORE,JSON.stringify(chats.slice(-50)))}
 catch{pendingError="Penyimpanan browser penuh. Hapus sebagian riwayat chat."}
}
function scrollBottom(){$("scroll").scrollTop=$("scroll").scrollHeight}
function closeMenu(){$("sidebar").classList.remove("open")}
function resizePrompt(){
 $("prompt").style.height="auto";
 $("prompt").style.height=Math.min($("prompt").scrollHeight,180)+"px";
}
async function copyText(text,btn){
 try{
  await navigator.clipboard.writeText(text);
 }catch{
  const t=document.createElement("textarea");
  t.value=text;t.style.position="fixed";t.style.opacity="0";
  document.body.append(t);t.select();document.execCommand("copy");t.remove();
 }
 if(btn){
  const old=btn.textContent;btn.textContent="Tersalin ✓";
  setTimeout(()=>btn.textContent=old,1200);
 }
}
function markdown(text){
 const box=document.createElement("div");
 box.innerHTML=DOMPurify.sanitize(marked.parse(String(text)));
 box.querySelectorAll("pre").forEach(pre=>{
  const code=pre.querySelector("code");if(!code)return;
  const lang=(code.className.match(/language-([\w+-]+)/)||[])[1]||"kode";
  const label=document.createElement("div");
  label.className="code-label";label.textContent=lang;
  const btn=document.createElement("button");
  btn.className="code-copy";btn.textContent="Salin kode";
  btn.onclick=()=>copyText(code.innerText,btn);
  pre.prepend(label);pre.append(btn);
 });
 box.querySelectorAll("a").forEach(a=>{
  a.target="_blank";a.rel="noopener noreferrer";
 });
 return box;
}
function showError(msg){
 const e=document.createElement("div");
 e.className="error";e.textContent=msg;
 $("messages").append(e);scrollBottom();
}
function welcome(){
 $("messages").innerHTML=`
 <section class="welcome">
  <div class="welcome-logo">L</div>
  <h1>Halo, bre.<br><span>Mau bikin apa hari ini?</span></h1>
  <p>Teman AI untuk ide, belajar, coding, dan menyelesaikan masalah.</p>
  <div class="suggestions">
   <button class="suggestion">Buatkan website keren</button>
   <button class="suggestion">Jelaskan JavaScript</button>
   <button class="suggestion">Bantu cari ide project</button>
   <button class="suggestion">Buat kode HTML</button>
  </div>
 </section>`;
 $("messages").querySelectorAll(".suggestion").forEach(b=>{
  b.onclick=()=>{$("prompt").value=b.textContent;resizePrompt();$("prompt").focus()};
 });
}
function appendMessage(m){
 const el=document.createElement("article");
 el.className="message "+m.role;
 const av=document.createElement("div");
 av.className="avatar";av.textContent=m.role==="assistant"?"L":"K";
 const body=document.createElement("div");body.className="content";
 const head=document.createElement("div");
 head.className="msg-head";head.textContent=m.role==="assistant"?"LANX AI":"Kamu";
 const text=document.createElement("div");
 if(m.role==="assistant"){
  text.className="prose";text.append(markdown(m.content));
 }else{
  text.className="user-text";text.textContent=m.content;
 }
 body.append(head,text);
 if(m.role==="assistant"){
  const actions=document.createElement("div");actions.className="actions";
  const copy=document.createElement("button");
  copy.className="smallbtn";copy.textContent="▢ Salin jawaban";
  copy.onclick=()=>copyText(m.content,copy);actions.append(copy);body.append(actions);
 }
 el.append(av,body);$("messages").append(el);
}
function render(){
 const c=current();$("messages").innerHTML="";
 if(!c||!c.messages.length)welcome();
 else c.messages.forEach(appendMessage);
 if(pendingError){const e=pendingError;pendingError="";showError(e)}
 scrollBottom();
}
function renderHistory(){
 $("history").innerHTML="";
 chats.slice().reverse().forEach(c=>{
  const row=document.createElement("div");row.className="history-item";
  const b=document.createElement("button");
  b.className="btn select-chat"+(c.id===currentId?" active":"");
  b.textContent="▤  "+(c.title||"Chat baru");
  b.onclick=()=>{
   if(busy)return;
   currentId=c.id;render();renderHistory();closeMenu();
  };
  const d=document.createElement("button");
  d.className="del";d.textContent="×";d.title="Hapus chat";
  d.onclick=()=>{
   if(busy)return;
   chats=chats.filter(x=>x.id!==c.id);
   if(currentId===c.id)currentId=chats.at(-1)?.id||null;
   if(!currentId)newChat();else{save();render();renderHistory()}
  };
  row.append(b,d);$("history").append(row);
 });
}
function newChat(){
 if(busy)return;
 const c={id:makeId(),title:"Chat baru",messages:[]};
 chats.push(c);currentId=c.id;save();render();renderHistory();
 $("prompt").value="";resizePrompt();closeMenu();
}
$("newChat").onclick=newChat;
$("mobileNew").onclick=newChat;
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("themeBtn").onclick=()=>{
 document.body.classList.toggle("light");
 if(document.body.classList.contains("light")){
  document.documentElement.style.setProperty("--bg","#f5f5f5");
  document.documentElement.style.setProperty("--panel","#fff");
  document.documentElement.style.setProperty("--card","#eee");
  document.documentElement.style.setProperty("--text","#171717");
  document.documentElement.style.setProperty("--muted","#777");
  document.documentElement.style.setProperty("--line","#ddd");
  $("themeBtn").textContent="◐  Tema gelap";
 }else{
  ["--bg","--panel","--card","--text","--muted","--line"].forEach(p=>document.documentElement.style.removeProperty(p));
  $("themeBtn").textContent="◐  Tema hitam";
 }
};
$("prompt").addEventListener("input",resizePrompt);
$("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit()}
});
async function sendMessage(text){
 if(busy||!text.trim())return;
 if(!currentId||!current())newChat();
 const chat=current();
 chat.messages.push({role:"user",content:text});
 if(chat.messages.filter(m=>m.role==="user").length===1)
  chat.title=text.slice(0,36)+(text.length>36?"…":"");
 save();render();renderHistory();busy=true;$("sendBtn").disabled=true;

 const typing=document.createElement("article");
 typing.className="message assistant";typing.id="typing";
 const av=document.createElement("div");av.className="avatar";av.textContent="L";
 const body=document.createElement("div");body.className="content";
 const head=document.createElement("div");head.className="msg-head";
 head.textContent="LANX AI sedang mengetik";
 const dots=document.createElement("div");dots.className="typing";
 dots.innerHTML="<span></span><span></span><span></span>";
 body.append(head,dots);typing.append(av,body);$("messages").append(typing);scrollBottom();

 try{
  const messages=chat.messages.slice(-20).map(m=>({role:m.role,content:m.content}));
  const res=await fetch("/api/chat",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });
  let data={};try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data.error||"Permintaan gagal ("+res.status+").");
  if(typeof data.reply!=="string")throw new Error("Jawaban AI tidak valid.");
  chat.messages.push({role:"assistant",content:data.reply});save();
 }catch(e){
  pendingError=e.message||"Gagal menghubungi AI. Periksa koneksi lalu coba lagi.";
 }finally{
  $("typing")?.remove();busy=false;$("sendBtn").disabled=false;
  render();renderHistory();$("prompt").focus();
 }
}
$("chatForm").addEventListener("submit",e=>{
 e.preventDefault();
 const t=$("prompt").value.trim();
 if(!t||busy)return;
 $("prompt").value="";resizePrompt();sendMessage(t);
});
if(!chats.length)newChat();
else{currentId=chats.at(-1).id;render();renderHistory()}
</script>
</body>
  </html>
